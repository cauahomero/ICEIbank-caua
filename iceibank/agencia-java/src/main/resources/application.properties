spring.application.name=iceibank-agencia
spring.main.banner-mode=off

# A mesma chave e usada pelas 3 agencias, entao um token emitido por uma vale nas outras.
jwt.segredo=iceibank-chave-secreta-sprint1-com-pelo-menos-32-bytes
jwt.expiracao-segundos=1800
auth.usuario=operador
auth.senha=senha123

# Respostas sempre em UTF-8 e com "charset=UTF-8" no Content-Type,
# para clientes como o PowerShell exibirem acentos corretamente
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

cdb.taxa=0.001
cdb.intervalo-ms=300000

# Mensageria: URL AMQP na variável RABBITMQ_URL (CloudAMQP: amqps://usuario:senha@host/vhost).
# Sem a variável, usa o RabbitMQ local do docker-compose.yml.
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://iceibank:iceibank@localhost:5672}
# Se o processamento de uma mensagem lançar exceção, descarta em vez de reentregar em loop
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Para o experimento de duplicidade: publica cada CreditoSolicitado duas vezes
mensageria.simular-duplicidade=false
